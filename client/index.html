    <script>try{document.documentElement.dataset.sportsGenomeBoot=localStorage.getItem("sports-genome-launch-experience-enabled-v1")==="off"?"off":"on";document.documentElement.dataset.sportsGenomeBootReturn=localStorage.getItem("sports-genome-launched-before-v1")==="yes"?"yes":"no";if(document.documentElement.dataset.sportsGenomeBoot==="on")document.documentElement.dataset.sportsGenomeBootStartedAt=String(Date.now())}catch(e){document.documentElement.dataset.sportsGenomeBoot="on";document.documentElement.dataset.sportsGenomeBootStartedAt=String(Date.now())}</script>
    <style>
      html,body{margin:0;min-height:100%;background:#0b2240}
      #sports-genome-boot-splash{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:#07182e;color:#f7f4ec;isolation:isolate;contain:layout paint style;will-change:opacity;transition:opacity 420ms cubic-bezier(.4,0,.2,1),visibility 420ms}
      .sports-genome-boot-content{position:relative;display:grid;justify-items:center;gap:10px;padding:28px;text-align:center}
      .sports-genome-boot-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#07182e;opacity:0;pointer-events:none;transform:translateZ(0);backface-visibility:hidden;will-change:opacity}
      .sports-genome-boot-mark{position:relative;width:min(208px,54vw);aspect-ratio:1;display:grid;place-items:center}
      .sports-genome-boot-logo{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.94) translateZ(0);backface-visibility:hidden;will-change:transform,opacity;animation:boot-mark-form 500ms 80ms cubic-bezier(.23,1,.32,1) both}
      .sports-genome-boot-dna-detail{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:0;transform:scale(.96) translateZ(0);backface-visibility:hidden;will-change:transform,opacity;animation:boot-dna-lines-in 420ms 560ms cubic-bezier(.23,1,.32,1) both}
      .sports-genome-boot-name{margin:0;font:800 clamp(22px,6vw,32px)/.92 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;opacity:0;transform:scale(.98);animation:boot-wordmark-in 480ms 1.03s cubic-bezier(.23,1,.32,1) both}
      .sports-genome-boot-label{margin:0;color:#c4d4e4;font:700 10px/1 "DM Sans",sans-serif;letter-spacing:.24em;text-transform:uppercase;opacity:0;transform:scale(.98);animation:boot-wordmark-in 400ms 1.2s cubic-bezier(.23,1,.32,1) both}
      html.sports-genome-boot-video-ready .sports-genome-boot-video{animation:boot-video-in 320ms cubic-bezier(.23,1,.32,1) both}
      html.sports-genome-boot-video-ready .sports-genome-boot-content{position:absolute;inset:0;display:block;padding:0}
      html.sports-genome-boot-video-ready .sports-genome-boot-mark{opacity:0}
      html.sports-genome-boot-video-ready .sports-genome-boot-logo,html.sports-genome-boot-video-ready .sports-genome-boot-dna-detail{animation:none;opacity:0}
      html.sports-genome-boot-video-ready .sports-genome-boot-name{position:absolute;right:0;bottom:17%;left:0;z-index:1;animation:boot-wordmark-in 480ms 1.03s cubic-bezier(.23,1,.32,1) both}
      html.sports-genome-boot-video-ready .sports-genome-boot-label{position:absolute;right:0;bottom:12.8%;left:0;z-index:1;animation:boot-wordmark-in 400ms 1.2s cubic-bezier(.23,1,.32,1) both}
      @media (min-width:641px){html.sports-genome-boot-video-ready .sports-genome-boot-video{top:50%;right:auto;bottom:auto;left:50%;width:min(100%,620px);height:min(100%,620px);transform:translate(-50%,-50%)}html.sports-genome-boot-video-ready .sports-genome-boot-name{bottom:10%}html.sports-genome-boot-video-ready .sports-genome-boot-label{bottom:5%}}
      /* The intro settles into the wordmark instead of freezing: one motion carrying
         into the splash fade rather than a pause competing with it. */
      html.sports-genome-boot-video-done.sports-genome-boot-video-ready .sports-genome-boot-video{opacity:.72;transform:scale(1.015);transition:opacity 420ms cubic-bezier(.23,1,.32,1),transform 620ms cubic-bezier(.23,1,.32,1)}
      @media (min-width:641px){html.sports-genome-boot-video-done.sports-genome-boot-video-ready .sports-genome-boot-video{transform:translate(-50%,-50%) scale(1.015)}}
      html[data-sports-genome-boot="off"] #sports-genome-boot-splash,html.sports-genome-app-ready #sports-genome-boot-splash{opacity:0;visibility:hidden;pointer-events:none}
      @keyframes boot-video-in{from{opacity:0}to{opacity:1}}
      @keyframes boot-mark-form{0%{opacity:0;transform:scale(.94) translateZ(0)}62%{opacity:1;transform:scale(1.012) translateZ(0)}100%{opacity:1;transform:scale(1) translateZ(0)}}
      @keyframes boot-dna-lines-in{0%{opacity:0;transform:scale(.96) translateZ(0)}68%{opacity:1;transform:scale(1.01) translateZ(0)}100%{opacity:1;transform:scale(1) translateZ(0)}}
      @keyframes boot-wordmark-in{0%{opacity:0;transform:translateY(10px) scale(.96)}72%{opacity:1;transform:translateY(-1px) scale(1.012)}100%{opacity:1;transform:translateY(0) scale(1)}}
      @media (prefers-reduced-motion:reduce){#sports-genome-boot-splash{display:none}.sports-genome-boot-video,.sports-genome-boot-logo,.sports-genome-boot-dna-detail,.sports-genome-boot-name,.sports-genome-boot-label{animation:none}}
    </style>
    <script>try{if(document.documentElement.dataset.sportsGenomeBootReturn!=="yes"&&document.documentElement.dataset.sportsGenomeBoot!=="off"){const l=document.createElement("link");l.rel="preload";l.as="video";l.type="video/mp4";l.setAttribute("fetchpriority","high");l.href="https://qiccnqkypbhlwpmjcsri.supabase.co/storage/v1/object/public/sports-genome-assets/sports-genome-intro-source_07000a26.mp4";document.head.appendChild(l)}}catch(e){}</script>
  </head>
  <body>
    <div id="sports-genome-boot-splash" aria-hidden="true"><video id="sports-genome-boot-video" class="sports-genome-boot-video" src="https://qiccnqkypbhlwpmjcsri.supabase.co/storage/v1/object/public/sports-genome-assets/sports-genome-intro-source_07000a26.mp4" muted playsinline preload="auto" disablepictureinpicture></video><div class="sports-genome-boot-content"><div class="sports-genome-boot-mark"><img class="sports-genome-boot-logo" src="https://qiccnqkypbhlwpmjcsri.supabase.co/storage/v1/object/public/sports-genome-assets/sports-genome-upright-s-silhouette-exact_349405db.png" alt="" /><img class="sports-genome-boot-dna-detail" src="https://qiccnqkypbhlwpmjcsri.supabase.co/storage/v1/object/public/sports-genome-assets/sports-genome-upright-dna-detail-exact_8e94e37f.png" alt="" /></div><p class="sports-genome-boot-name">Sports Genome</p><p class="sports-genome-boot-label">Decoding performance</p></div></div>
    <script>try{window.setTimeout(function(){document.documentElement.classList.add("sports-genome-app-ready")},9000)}catch(e){}</script>
    <script>try{
      var root = document.documentElement;
      var video = document.getElementById("sports-genome-boot-video");
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var startedAt = Number(root.dataset.sportsGenomeBootStartedAt || Date.now());
      // One signal, sent once, whether the intro ended, stalled or never started.
      // The app waits on this instead of on a fixed duration, so editing the asset
      // cannot silently clip it again.
      var settled = false;
      var settle = function (state) {
        if (settled) return;
        settled = true;
        root.dataset.sportsGenomeBootVideo = state;
        root.classList.add("sports-genome-boot-video-done");
        try { window.dispatchEvent(new Event("sports-genome-boot-video-done")); } catch (e) {}
      };
      var wantsVideo = video && !reduced
        && root.dataset.sportsGenomeBoot !== "off"
        && root.dataset.sportsGenomeBootReturn !== "yes";
      if (!wantsVideo) {
        root.dataset.sportsGenomeBootVideo = "skipped";
      } else {
        root.dataset.sportsGenomeBootVideo = "playing";
        video.muted = true;
        // Ending is the hand-off. There is deliberately no timer that pauses the
        // video partway: that freeze, a frame before the splash faded, was the cut.
        video.addEventListener("ended", function () { settle("done"); }, { once: true });
        video.addEventListener("error", function () { settle("skipped"); }, { once: true });
        video.addEventListener("canplay", function () {
          // Starting three seconds late is more jarring than not starting: by then
          // the static choreography has already told the story.
          if (Date.now() - startedAt > 1100) { settle("skipped"); return; }
          video.play().then(function () {
            root.classList.add("sports-genome-boot-video-ready");
          }).catch(function () { settle("skipped"); });
        }, { once: true });
        // Only a stalled download reaches this; the normal path ends well before.
        window.setTimeout(function () { settle("done"); }, 4000);
      }
    }catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
