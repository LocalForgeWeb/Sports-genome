      /* The choreography starts when there is something to choreograph.
         These four animations used to run on a fixed clock from first paint,

         against an empty box, and the PNG then snapped in at 1220ms having
         missed its own entrance. At 2.5s the splash lifted at 2466ms without

         have decoded - and the hold that keeps the screen up is measured from
         the same moment, so the sequence is never cut halfway. */

    <div id="sports-genome-boot-splash" aria-hidden="true"><video id="sports-genome-boot-video" class="sports-genome-boot-video" src="https://qiccnqkypbhlwpmjcsri.supabase.co/storage/v1/object/public/sports-genome-assets/sports-genome-intro-source_07000a26.mp4" muted playsinline preload="auto" disablepictureinpicture></video><div class="sports-genome-boot-content"><div class="sports-genome-boot-mark"><img class="sports-genome-boot-logo" src="https://qiccnqkypbhlwpmjcsri.supabase.co/storage/v1/object/public/sports-genome-assets/sports-genome-upright-s-silhouette-exact_349405db.png" alt="" /><img class="sports-genome-boot-dna-detail" src="https://qiccnqkypbhlwpmjcsri.supabase.co/storage/v1/object/public/sports-genome-assets/sports-genome-upright-dna-detail-exact_8e94e37f.png" alt="" /></div><p class="sports-genome-boot-name">Sports Genome</p><p class="sports-genome-boot-label">Decoding performance</p></div></div>
    <!-- When the choreography may begin: the moment its artwork can actually be drawn.
         `decode()` rather than `load`, because load fires before the bitmap is
         paintable and the first frame of a 500ms scale-up is exactly where that
         gap shows. The ceiling exists so a dead asset cannot hold the screen -
         past it the sequence runs anyway, which is the old behaviour and still
         better than a frozen dark rectangle. -->
    <script>try{(function(){
      var root = document.documentElement;
      var marked = false;
      var begin = function () {
        if (marked) return;
        marked = true;
        root.dataset.sportsGenomeBootArtAt = String(Date.now());
        root.classList.add("sports-genome-boot-art-ready");
        // React holds the screen for the length of the sequence, so it has to
        // be told when the sequence starts. Sampling the stamp once at mount
        // was not enough: a mount at 800ms and art at 2500ms read no stamp,
        // fell back to the document's start, and lifted the splash at 1720ms -
        // before the mark had loaded at all.
        try { window.dispatchEvent(new Event("sports-genome-boot-art-ready")); } catch (e) {}
      };
      var art = [].slice.call(document.querySelectorAll("#sports-genome-boot-splash img"));
      var pending = art.length;
      if (!pending) { begin(); return; }
      var settleOne = function () { if (--pending <= 0) begin(); };
      art.forEach(function (img) {
        var ready = function () {
          if (typeof img.decode === "function") { img.decode().then(settleOne, settleOne); return; }
          settleOne();
        };
        if (img.complete) { ready(); return; }
        img.addEventListener("load", ready, { once: true });
        // A broken asset must not hold the other one hostage.
        img.addEventListener("error", settleOne, { once: true });
      });
      window.setTimeout(begin, 2500);
    })()}catch(e){var r=document.documentElement;r.dataset.sportsGenomeBootArtAt=String(Date.now());r.classList.add("sports-genome-boot-art-ready");try{window.dispatchEvent(new Event("sports-genome-boot-art-ready"))}catch(e2){}}</script>
    <!-- Last resort for a React that never arrives. It reveals the app with no cross-fade,
         so it must not fire while the intro is still running - but a flat extension would
         also punish a genuine failure with a longer blank stare. So it keeps its 9 seconds
         and only defers, a second at a time, while the video's clock is actually advancing.
         The intro's own watchdog guarantees that state ends, so this always terminates. -->
    <script>try{(function(){var reveal=function(){document.documentElement.classList.add("sports-genome-app-ready")};var check=function(){var v=document.getElementById("sports-genome-boot-video");if(document.documentElement.dataset.sportsGenomeBootVideo==="playing"&&v&&!v.paused&&!v.ended&&v.currentTime>0){window.setTimeout(check,1000);return}reveal()};window.setTimeout(check,9000)})()}catch(e){}</script>
    <script>try{
      var root = document.documentElement;
      var video = document.getElementById("sports-genome-boot-video");
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var startedAt = Number(root.dataset.sportsGenomeBootStartedAt || Date.now());
      // One signal, sent once, whether the intro ended, stalled or never started.
      // The app waits on this instead of on a fixed duration, so editing the asset
      // cannot silently clip it again.
      var settled = false;
      var settle = function (state) {
        if (settled) return;
        settled = true;
        root.dataset.sportsGenomeBootVideo = state;
        root.classList.add("sports-genome-boot-video-done");
        try { window.dispatchEvent(new Event("sports-genome-boot-video-done")); } catch (e) {}
      };
      var replay = root.dataset.sportsGenomeBootReplay === "yes";
      var wantsVideo = video && !reduced
        && root.dataset.sportsGenomeBoot !== "off"
        && root.dataset.sportsGenomeBootReturn !== "yes";
      if (!wantsVideo) {
        root.dataset.sportsGenomeBootVideo = "skipped";
      } else {
        root.dataset.sportsGenomeBootVideo = "playing";
        video.muted = true;
        // Ending is the hand-off. There is deliberately no timer that pauses the
        // video partway: that freeze, a frame before the splash faded, was the cut.
        video.addEventListener("ended", function () { settle("done"); }, { once: true });
        video.addEventListener("error", function () { settle("skipped"); }, { once: true });
        video.addEventListener("canplay", function () {
          // Starting late is more jarring than not starting: by then the static
          // choreography has already told the story. Measured from when that
          // choreography began, which is when its artwork could be drawn - not
          // from when the document started, because the gap between the two is
          // exactly the slow connection this gate kept punishing. No stamp yet
          // means the sequence has not begun, so nothing has been told and the
          // intro is not late. A replay is exempt: watching it is the reason
          // the athlete asked.
          var artAt = Number(root.dataset.sportsGenomeBootArtAt);
          var storyStartedAt = (artAt > 0) ? artAt : 0;
          if (!replay && storyStartedAt && Date.now() - storyStartedAt > 1100) { settle("skipped"); return; }
          video.play().then(function () {
            root.classList.add("sports-genome-boot-video-ready");
          }).catch(function () { settle("skipped"); });
        }, { once: true });
        /**
         * "Has it been long enough?" was the wrong question, and a flat 4-second answer
         * cut a six-second intro at 4.41s. The question is "is it still going?".
         *
         * So: an intro that never starts is abandoned on the old 4-second ceiling, and
         * one that IS playing runs until it ends, stops progressing, or passes its own
         * declared duration. The hard ceiling is only reachable while the clock is still
         * advancing - which is to say, while it is genuinely still playing.
         */
        var playing = false;
        var lastTime = -1;
        var lastProgressAt = Date.now();
        video.addEventListener("playing", function () { playing = true; lastProgressAt = Date.now(); });
        var watch = window.setInterval(function () {
          if (settled) { window.clearInterval(watch); return; }
          var now = Date.now();
          var sinceStart = now - startedAt;
          if (video.currentTime > lastTime) { lastTime = video.currentTime; lastProgressAt = now; }
          if (!playing) {
            if (sinceStart > (replay ? 8000 : 4000)) { window.clearInterval(watch); settle("skipped"); }
            return;
          }
          var durationMs = (video.duration && isFinite(video.duration)) ? video.duration * 1000 : 0;
          var stalled = now - lastProgressAt > 1500;
          var overran = (durationMs && sinceStart > durationMs + 2000) || sinceStart > 15000;
          if (stalled || overran) { window.clearInterval(watch); settle("done"); }
        }, 250);
      }
    }catch(e){}</script>
