<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Sports Genome — Decoding Performance</title>
    <meta name="description" content="Build sport-aware workouts from a 400-exercise movement and muscle catalog." />
    <link rel="icon" type="image/png" sizes="64x64" href="/manus-storage/sports-genome-official-logo-64_f1d0979d.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/manus-storage/sports-genome-official-logo-180_8085dfd8.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b2240" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sports Genome" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <script>try{document.documentElement.dataset.sportsGenomeBoot=localStorage.getItem("sports-genome-launch-experience-enabled-v1")==="off"?"off":"on"}catch(e){document.documentElement.dataset.sportsGenomeBoot="on"}</script>
    <style>
      html,body{margin:0;min-height:100%;background:#000}
      #sports-genome-boot-splash{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:#000;color:#f7f4ec;isolation:isolate;transition:opacity 560ms cubic-bezier(.23,1,.32,1),visibility 560ms}
      #sports-genome-boot-splash:before,#sports-genome-boot-splash:after{position:absolute;content:"";border-radius:999px;filter:blur(54px);opacity:.52;pointer-events:none}
      #sports-genome-boot-splash:before{width:62vw;height:26vh;background:#0b2240;transform:translate(-28vw,-24vh)}
      #sports-genome-boot-splash:after{width:42vw;height:20vh;background:#e4512e;transform:translate(35vw,31vh);opacity:.16}
      .sports-genome-boot-content{position:relative;display:grid;justify-items:center;gap:15px;padding:32px;text-align:center;opacity:0;transform:translateY(10px);animation:boot-content-in 1.1s .24s cubic-bezier(.23,1,.32,1) both}
      .sports-genome-boot-mark{position:relative;width:min(224px,56vw);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 0 32px rgba(228,81,46,.16))}
      .sports-genome-boot-logo{display:block;width:100%;height:100%;object-fit:contain;opacity:0;clip-path:inset(100% 0 0 0);transform:scale(.9) translateY(12px);filter:drop-shadow(0 11px 20px rgba(0,0,0,.22));will-change:clip-path,transform,opacity;animation:boot-upright-logo 2.45s .32s cubic-bezier(.23,1,.32,1) both}
      .sports-genome-boot-name{margin:0;font:800 clamp(22px,6vw,34px)/.92 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase}
      .sports-genome-boot-label{margin:0;color:#b8c8d9;font:700 10px/1 "DM Sans",sans-serif;letter-spacing:.24em;text-transform:uppercase}
      html[data-sports-genome-boot="off"] #sports-genome-boot-splash,html.sports-genome-app-ready #sports-genome-boot-splash{opacity:0;visibility:hidden;pointer-events:none}
      @keyframes boot-content-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      @keyframes boot-upright-logo{0%{opacity:0;clip-path:inset(100% 0 0 0);transform:scale(.9) translateY(12px);filter:brightness(.55) drop-shadow(0 11px 20px rgba(0,0,0,.22))}28%{opacity:.86;clip-path:inset(71% 0 0 0);transform:scale(.965) translateY(5px);filter:brightness(.92) drop-shadow(0 11px 20px rgba(0,0,0,.22))}66%{opacity:1;clip-path:inset(18% 0 0 0);transform:scale(1.015) translateY(0);filter:brightness(1.06) drop-shadow(0 11px 20px rgba(0,0,0,.22))}100%{opacity:1;clip-path:inset(0 0 0 0);transform:scale(1) translateY(0);filter:brightness(1) drop-shadow(0 11px 20px rgba(0,0,0,.22))}}
      @media (prefers-reduced-motion:reduce){#sports-genome-boot-splash{display:none}.sports-genome-boot-content,.sports-genome-boot-logo{animation:none}}
    </style>
  </head>
  <body>
    <div id="sports-genome-boot-splash" aria-hidden="true"><div class="sports-genome-boot-content"><div class="sports-genome-boot-mark"><img class="sports-genome-boot-logo" src="/manus-storage/sports-genome-upright-s-dna-logo_53affec0.jpg" alt="" /></div><p class="sports-genome-boot-name">Sports Genome</p><p class="sports-genome-boot-label">Decoding performance</p></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
