<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the iOS webview draw under the notch and home
         indicator; native-shell.css adds the safe-area insets back where they matter. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Gym Optimizer — Sport-Aware Training Atlas</title>
    <meta name="description" content="Build sport-aware workouts from a 400-exercise movement and muscle catalog." />
    <link rel="icon" type="image/png" href="/manus-storage/gym-optimizer-logo_32341cfa.png" />
    <!-- Add to Home Screen on iOS. `apple-mobile-web-app-capable` is the legacy
         spelling Safari still requires for standalone display; the unprefixed
         name is the standard one other browsers read. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sports Genome" />
    <meta name="theme-color" content="#0b2240" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
