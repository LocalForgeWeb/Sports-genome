# Builds the iOS app on a GitHub-hosted macOS runner.
#
# This exists so that shipping to iPhone does not require owning a Mac. Xcode
# only runs on macOS, but it does not have to be *your* macOS.
#
# Two jobs, deliberately separate:
#
#   simulator  — no Apple account, no secrets, no signing. Proves the whole
#                native setup compiles. Run this first and on every change.
#   testflight — signed build uploaded to TestFlight, so the app can be
#                installed on a real phone. Needs the $99 Apple Developer
#                Program and the secrets listed below.
#
# COST: macOS runners bill at 10x the Linux rate on private repositories.
# Both jobs are manual (workflow_dispatch) for that reason — turn on a push
# trigger only once you know how long a run takes.

name: iOS

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which build to run"
        type: choice
        options: [simulator, testflight]
        default: simulator

env:
  NODE_VERSION: "22"

jobs:
  simulator:
    # The free one. Catches a broken Capacitor config, a missing pod, or a
    # Swift compile error without any Apple account involved.
    if: inputs.job == 'simulator'
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm check
          pnpm test

      - name: Build the web bundle
        # A placeholder API origin is fine here: this job proves the app
        # compiles, not that it can reach a server.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://example.invalid' }}
          VITE_NATIVE_APP_SCHEME: sportsgenome
        run: pnpm build:client

      - name: Generate the iOS project
        # `ios/` is regenerated when it is not committed, so the build stays
        # reproducible either way.
        run: |
          if [ -d ios ]; then
            npx cap sync ios
          else
            npx cap add ios
          fi

      - name: Apply native configuration
        run: bash scripts/configure-ios.sh

      - name: Install pods
        working-directory: ios/App
        run: pod install

      - name: Build for the simulator
        # CODE_SIGNING_ALLOWED=NO is what makes this work with no certificate.
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  testflight:
    # Produces something you can actually install on your phone.
    #
    # Required repository secrets:
    #   IOS_CERTIFICATE_P12       distribution certificate, base64 of the .p12
    #   IOS_CERTIFICATE_PASSWORD  password for that .p12
    #   IOS_PROVISIONING_PROFILE  App Store profile, base64 of the .mobileprovision
    #   APPSTORE_KEY_ID           App Store Connect API key id
    #   APPSTORE_ISSUER_ID        App Store Connect issuer id
    #   APPSTORE_PRIVATE_KEY      contents of the .p8 key file
    #
    # The team id, profile name and bundle id are read from the provisioning
    # profile and capacitor.config.ts at build time, so they are not secrets.
    #
    # `bash scripts/ios-signing.sh` generates the certificate and prints these.
    # Required repository variable:
    #   VITE_API_BASE_URL         absolute origin of the deployed API
    if: inputs.job == 'testflight'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_NATIVE_APP_SCHEME: sportsgenome
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL repository variable is not set."
            echo "The app would ship unable to reach the API. Set it under"
            echo "Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          pnpm build:client

      - name: Generate the iOS project
        run: |
          if [ -d ios ]; then
            npx cap sync ios
          else
            npx cap add ios
          fi

      - name: Apply native configuration
        run: bash scripts/configure-ios.sh

      - name: Install pods
        working-directory: ios/App
        run: pod install

      - name: Import signing certificate and profile
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # A throwaway keychain scoped to this runner, destroyed with the VM.
          # Never unlock the default login keychain in CI.
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          # openssl rather than base64(1): the macOS build does not accept
          # --decode, and -d/-D differ between versions.
          echo -n "$CERTIFICATE_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          echo -n "$PROVISIONING_PROFILE" | openssl base64 -d -A -out "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          if ! security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" \
               -A -t cert -f pkcs12 -k "$KEYCHAIN"; then
            echo "::error::Could not import the signing certificate."
            echo "The usual cause is a .p12 written by OpenSSL 3 with its default"
            echo "AES-256 encryption, which this importer rejects. Regenerate it"
            echo "with 'bash scripts/ios-signing.sh p12 <cert.cer>', which forces"
            echo "the 3DES/SHA-1 encoding macOS accepts."
            exit 1
          fi

          security list-keychain -d user -s "$KEYCHAIN"
          # Lets xcodebuild use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Read the team, profile name and UUID out of the profile itself
          # rather than carrying them as extra secrets that can drift from it.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")

          # Xcode looks profiles up by UUID filename.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          BUNDLE_ID=$(grep -oE 'appId:[[:space:]]*"[^"]+"' capacitor.config.ts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

          echo "Team: $TEAM_ID"
          echo "Profile: $PROFILE_NAME"
          echo "Bundle id: $BUNDLE_ID"

          {
            echo "TEAM_ID=$TEAM_ID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "BUNDLE_ID=$BUNDLE_ID"
          } >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive
        run: |
          # Manual signing with an explicit profile. Automatic signing would ask
          # Apple to mint a new certificate on each ephemeral runner, and the
          # account's certificate limit is reached within a few builds.
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export the .ipa
        run: |
          # Written with a script rather than committed, because the team id and
          # profile name are only known once the profile has been decoded.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # altool looks the key up by id in this fixed location.
          mkdir -p ~/private_keys
          echo -n "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8

          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa was produced by the export step."
            exit 1
          fi

          # The app record must already exist in App Store Connect; the upload
          # cannot create it.
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Keep the build even if the upload fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
